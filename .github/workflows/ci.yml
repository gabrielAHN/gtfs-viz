name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  build:
    name: Build, check and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn

      - run: yarn install --frozen-lockfile --ignore-engines
      - run: yarn build
      - run: yarn run check
      - run: yarn test

      # gabrielAHN/gtfs-tools includes this repository as a git submodule and runs this same script
      # to build its CLI dashboard: the CLI-mode web app plus packages/web/dist/dashboard-manifest.json.
      - run: yarn build:dashboard

      # Exactly name (the root package name + "-dashboard"), version, the checked-out commit, cliApi 1.
      - name: Check the dashboard manifest
        run: |
          node --input-type=module -e '
            import assert from "node:assert/strict"
            import { execFileSync } from "node:child_process"
            import { readFileSync } from "node:fs"
            const pkg = JSON.parse(readFileSync("package.json", "utf8"))
            const manifest = JSON.parse(readFileSync("packages/web/dist/dashboard-manifest.json", "utf8"))
            console.log(manifest)
            assert.deepEqual(manifest, {
              name: pkg.name + "-dashboard",
              version: pkg.version,
              commit: execFileSync("git", ["rev-parse", "HEAD"], { encoding: "utf8" }).trim(),
              cliApi: 1,
            })
          '

  extension-integration:
    name: GTFS DuckDB integration
    needs: build
    runs-on: ubuntu-24.04
    env:
      EXTENSION_REPOSITORY: gabrielAHN/gtfs-duckdb
      EXTENSION_BRANCH: ${{ vars.GTFS_EXTENSION_BRANCH || 'main' }}
      GTFS_STAGED_REPOSITORY: ${{ github.workspace }}/build/staged-repository
      DUCKDB_BIN: ${{ github.workspace }}/build/duckdb-cli/duckdb
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn

      - name: Download staged extension repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh run list --repo "$EXTENSION_REPOSITORY" --workflow MainDistributionPipeline.yml --branch "$EXTENSION_BRANCH" --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          if [ -z "$run_id" ]; then
            echo "::error::No successful $EXTENSION_REPOSITORY build on $EXTENSION_BRANCH"
            exit 1
          fi
          echo "Using $EXTENSION_REPOSITORY run $run_id ($EXTENSION_BRANCH)"
          gh run download "$run_id" --repo "$EXTENSION_REPOSITORY" --name gtfs-unsigned-development-repository --dir "$GTFS_STAGED_REPOSITORY"
          cat "$GTFS_STAGED_REPOSITORY/manifest.json"

      - name: Install DuckDB CLI v2.0.0, spatial, httpfs and aws
        run: |
          mkdir -p build/duckdb-cli
          curl -fsSL -o build/duckdb-cli/cli.tar.gz https://github.com/duckdb/duckdb/releases/download/v2.0.0/duckdb-cli-linux-amd64.tar.gz
          tar -xzf build/duckdb-cli/cli.tar.gz -C build/duckdb-cli
          echo "$GITHUB_WORKSPACE/build/duckdb-cli" >> "$GITHUB_PATH"
          echo "GTFS_DEPENDENCY_CACHE=$HOME/.duckdb/extensions" >> "$GITHUB_ENV"
          "$DUCKDB_BIN" :memory: -c "INSTALL spatial; INSTALL httpfs; INSTALL aws; SELECT version(); PRAGMA platform;"
          gunzip -c "$GTFS_STAGED_REPOSITORY/v2.0.0/linux_amd64/gtfs.duckdb_extension.gz" > build/gtfs.duckdb_extension
          echo "GTFS_EXTENSION=$GITHUB_WORKSPACE/build/gtfs.duckdb_extension" >> "$GITHUB_ENV"

      - run: yarn install --frozen-lockfile --ignore-engines
      - run: npx playwright install --with-deps chromium
      - run: yarn build

      - name: Tests with the downloaded extension
        run: yarn test

      - name: Native client (unsigned development loading)
        run: node packages/duckdb-client/tests/integration/consumer-native.mjs

      - name: Browser client (unsigned development loading)
        run: node packages/duckdb-client/tests/integration/consumer-wasm.mjs --unsigned-only

      - name: Web app downloads the extension
        run: node packages/duckdb-client/tests/integration/consumer-app.mjs

      - name: Web app reports a missing repository
        run: node packages/duckdb-client/tests/integration/consumer-app.mjs --missing-config

      - name: Strict browser signature check (known DuckDB-WASM MVP failure)
        continue-on-error: true
        run: node packages/duckdb-client/tests/integration/consumer-wasm.mjs
