name: Release & Publish

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Get version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if release exists
        id: check
        uses: actions/github-script@v7
        env:
          TAG: ${{ steps.version.outputs.tag }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const tag = process.env.TAG;
            try {
              await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag,
              });
              core.info(`Release ${tag} already exists — skipping`);
              core.setOutput("exists", "true");
            } catch (error) {
              if (error.status === 404) {
                core.setOutput("exists", "false");
              } else {
                throw error;
              }
            }

      - name: Create tag and release
        if: steps.check.outputs.exists == 'false'
        uses: actions/github-script@v7
        env:
          TAG: ${{ steps.version.outputs.tag }}
          PR_BODY: ${{ github.event.pull_request.body || '' }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const tag = process.env.TAG;
            const prBody = process.env.PR_BODY;

            // Create tag
            const sha = context.sha;
            await github.rest.git.createRef({
              owner,
              repo,
              ref: `refs/tags/${tag}`,
              sha,
            });

            // Create release with PR body or auto-generated notes
            const useAutoNotes = !prBody || prBody.trim().length === 0;
            await github.rest.repos.createRelease({
              owner,
              repo,
              tag_name: tag,
              name: tag,
              body: useAutoNotes ? undefined : prBody,
              generate_release_notes: useAutoNotes,
              make_latest: "true",
            });
            core.info(`Created release ${tag}`);

      - name: Check if CLI version already published
        id: npm_check
        run: |
          CLI_VERSION=$(node -p "require('./packages/cli/package.json').version")
          PUBLISHED=$(npm view "@gabrielahn/gtfs-viz-cli@${CLI_VERSION}" version 2>/dev/null || echo "")
          if [ -n "$PUBLISHED" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "CLI $CLI_VERSION already on npm — skipping publish"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Will publish CLI $CLI_VERSION"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Install dependencies
        if: steps.npm_check.outputs.skip != 'true'
        run: yarn install --frozen-lockfile --ignore-engines

      - name: Build all packages
        if: steps.npm_check.outputs.skip != 'true'
        run: yarn build

      - name: Publish CLI to npm
        if: steps.npm_check.outputs.skip != 'true'
        working-directory: packages/cli
        run: npm publish --access public --tag latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
